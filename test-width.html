<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Width Test</title>
  <style>
    body { margin: 0; padding: 0; background: yellow; }
    .full-width { background: lime; width: 100%; height: 100px; }
    .half-width { background: red; width: 50%; height: 100px; margin: 0 auto; }
  </style>
</head>
<body>
  <div class="full-width">This should be full width</div>
  <div class="half-width">This should be half width and centered</div>
</body>
</html>
